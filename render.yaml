    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKSHOP_PIN
        value: 1234
      - key: APIS_NET_PE_TOKEN
        value: sk_12673.wvjOp4ZRg6p5tUWFoFIlrQLLO1blIAix
      - key: GEMINI_API_KEY
        sync: false
    # NOTA PARA RENDER: En el plan gratuito de Render, el disco se restablece al suspenderse.
