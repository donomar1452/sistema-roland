services:
  - type: web
    name: sistema-roland-alonso
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKSHOP_PIN
        value: 1234
      - key: GEMINI_API_KEY
        sync: false
